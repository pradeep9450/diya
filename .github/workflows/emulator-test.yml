# Installs Diya on an Android emulator, uses it, and saves logs + screenshots
# to the ci-results branch (folder emulator/), so problems can be seen directly.
name: Emulator test

on:
  push:
    branches: [lab]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Pack the offline wake-word model into the app
        run: |
          curl -sSL --retry 3 -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-in-0.4.zip
          unzip -q model.zip -d /tmp/model
          mv /tmp/model/vosk-model-small-en-in-0.4 app/src/main/assets/model-en-in
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -q
          cp app/build/outputs/apk/release/app-release.apk Diya.apk
      - name: Virtual microphone and test speech
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq pulseaudio pulseaudio-utils ffmpeg > /dev/null
          pulseaudio -D --exit-idle-time=-1 --disallow-exit
          sleep 2
          pactl load-module module-null-sink sink_name=vmic sink_properties=device.description=VirtualMic
          pactl load-module module-null-sink sink_name=spk sink_properties=device.description=Speaker
          pactl set-default-source vmic.monitor
          pactl set-default-sink spk
          pip install -q gTTS
          python3 ci/make_audio.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis_playstore
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none -allow-host-audio
          script: bash ci/emulator_test.sh
      - name: Save results
        if: always()
        run: |
          git fetch -q origin ci-results || true
          mkdir pub && cd pub
          git init -q -b ci-results
          git config user.name "diya-ci" && git config user.email "diya-ci@users.noreply.github.com"
          (git pull -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-results || true)
          rm -rf emulator && mkdir emulator && cp -r ../emu-out/* emulator/ 2>/dev/null || true
          git add -A && git commit -qm "Emulator results ${{ github.sha }}" || true
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-results
