# Lab test for the "Hey Diya" wake word: synthesises speech, runs it through
# Diya's offline model and saves what it hears to the ci-results branch.
name: Wake word lab test

on:
  push:
    paths:
      - "ci/**"
      - "app/src/main/assets/wake_grammar.json"
      - ".github/workflows/wake-test.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg > /dev/null
          pip install -q vosk gTTS
      - name: Download the model Diya uses
        run: |
          curl -sSL -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-in-0.4.zip
          unzip -q model.zip && mv vosk-model-small-en-in-0.4 model
      - name: Run test
        run: python ci/wake_test.py model results.json app/src/main/assets/wake_grammar.json
      - name: Save results to ci-results branch
        run: |
          mkdir out && cp results.json out/ && cd out
          git init -q -b ci-results
          git config user.name "diya-ci" && git config user.email "diya-ci@users.noreply.github.com"
          git add results.json && git commit -qm "Wake test results ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-results
